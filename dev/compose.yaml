# Development instance for the vaccinations app.
# Meant for the local network only – no TLS, debug mode on.
# See dev/README.md for setup on the Synology DiskStation.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    volumes:
      - db:/var/lib/postgresql/data

  # Docker creates custom_apps as root because the app is bind-mounted into it,
  # and the image only initialises that folder when it is empty. Without this,
  # Nextcloud cannot write to custom_apps and the app management page fails.
  init-permissions:
    image: alpine:3
    restart: "no"
    command: sh -c "mkdir -p /var/www/html/custom_apps && chown 33:33 /var/www/html/custom_apps"
    volumes:
      - nextcloud:/var/www/html

  app:
    image: nextcloud:${NC_VERSION:-35}-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      init-permissions:
        condition: service_completed_successfully
    ports:
      - "${NC_PORT:-8090}:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?NC_ADMIN_PASSWORD fehlt in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_TRUSTED_DOMAINS:-localhost}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:?DEV_USER_PASSWORD fehlt in .env}
    volumes: &app-volumes
      - nextcloud:/var/www/html
      # the repository itself is the app – edits are live without rebuilding
      - ../:/var/www/html/custom_apps/vaccinations:ro
      - ./hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro

  # runs Nextcloud background jobs every 5 minutes (needed for notifications later)
  cron:
    image: nextcloud:${NC_VERSION:-35}-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      init-permissions:
        condition: service_completed_successfully
    entrypoint: /cron.sh
    volumes: *app-volumes

  # builds the frontend into js/ and css/ and rebuilds on every change (e.g. after git pull)
  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run watch"
    environment:
      # file change events do not reliably reach containers on Synology bind mounts – poll instead
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "2000"
    volumes:
      - ../:/app

volumes:
  db:
  nextcloud:
