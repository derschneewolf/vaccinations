name: Validate vaccine data

on:
  pull_request:
    paths: ['data/**', 'bin/validate-data.mjs']
  push:
    branches: [main]
    paths: ['data/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
