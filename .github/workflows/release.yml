name: Release

# Publishes a GitHub release with the installable app archive whenever main
# contains an app version (appinfo/info.xml) that has not been released yet.
# To release: raise <version> in appinfo/info.xml and push to main.
on:
  push:
    branches: [main]
    paths: ['appinfo/info.xml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released – nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build archive
        if: steps.version.outputs.exists != 'true'
        run: |
          npm ci
          npm run validate:data
          npm run build
          bin/package.sh

      - name: Create release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # release notes: the section "## <version> – <date>" of CHANGELOG.md
          awk -v heading="## $VERSION" 'index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            : > notes.md
          fi
          printf '\n---\nInstallation und Update: siehe [README](https://github.com/%s#installation).\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release create "v$VERSION" "build/vaccinations-$VERSION.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
