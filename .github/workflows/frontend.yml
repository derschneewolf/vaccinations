name: Frontend

on:
  pull_request:
    paths: ['src/**', 'l10n/**', 'bin/**', 'package*.json', 'vite.config.js']
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Translations complete and up to date
        run: |
          npm run l10n
          git diff --exit-code l10n/
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vaccinations-frontend
          path: |
            js/
            css/
